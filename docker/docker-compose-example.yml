services:
  slackonos:
    container_name: slackonos
    hostname: slackonos
    image: htilly/slackonos:latest
    restart: unless-stopped
    environment:
      # Optional: Override config with environment variables
      - HOST_IP=192.168.1.100  # Replace with your Docker host's IP address (required for TTS to work)
      # - NODE_ENV=production
      # The app runs as an unprivileged user (uid/gid 1000) and takes ownership
      # of the config folder at startup. Set these to run as another user,
      # e.g. the owner of the config folder on a NAS:
      # - PUID=1000
      # - PGID=1000
    volumes:
      - PATH_TO_CONFIG_FOLDER/slackonos/config:/app/config
    ports:
      - "8080:8080"  # HTTP (redirectar)
      - "8443:8443"  # HTTPS (faktiska förfrågningar)
    # Optional: Use host network for better Sonos discovery
    # network_mode: "host"
