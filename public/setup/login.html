<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlackONOS - Login</title>
  <link rel="stylesheet" href="/setup/setup.css?v=6.0">
</head>
<body>
  <div class="background-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  
  <div class="wizard-container login-container">
    <div class="wizard login-card">
      <div class="login-header">
        <img src="/setup/SlackONOS-256.png?v=6.0" srcset="/setup/SlackONOS-256.png?v=6.0 1x, /setup/SlackONOS-512.png?v=6.0 2x" alt="SlackONOS Logo" class="app-logo" width="128" height="128">
        <h1>Admin Login</h1>
        <p>Enter your credentials to access the admin panel</p>
      </div>
      
      <div id="error-message" class="error-message"></div>
      
      <!-- WebAuthn Login Section (Primary - Passwordless) -->
      <div id="webauthn-section" class="auth-option" style="display: none;">
        <div class="auth-option-header">
          <div class="auth-icon">🔐</div>
          <h3>Passwordless Login</h3>
          <p>
          Use your FIDO2 security key or biometric
          </p>
        </div>
        <button type="button" class="btn-login btn-webauthn" id="btn-webauthn">
          🔐 Login with Yubikey!
        </button>
      </div>
      
      <!-- Password Login Section (Secondary) -->
      <div id="password-section" style="display: none;">
        <!-- Divider -->
        <div class="login-divider">
          <span>Or use password</span>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin">
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
          </div>
          
          <button type="submit" class="btn-login" id="btn-login">
            Login with Password
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@9.0.0/dist/bundle/index.umd.min.js"></script>
  <script src="/setup/webauthn-client.js"></script>
  <script>
    const API_BASE = '/api/auth';
    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('error-message');
    const btnLogin = document.getElementById('btn-login');
    const btnWebAuthn = document.getElementById('btn-webauthn');
    const webauthnSection = document.getElementById('webauthn-section');
    const passwordSection = document.getElementById('password-section');

    const logClient = async (message, meta = {}) => {
      try {
        await fetch('/api/admin/webauthn-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, meta })
        });
      } catch (e) {}
    };

    // Only allow same-origin, relative paths as a redirect target. Rejects
    // absolute URLs, protocol-relative URLs (//evil.com) and anything that
    // doesn't parse as a plain path, closing CodeQL js/xss and
    // js/client-side-unvalidated-url-redirection on window.location.href below.
    function sanitizeReturnUrl(raw) {
      const fallback = '/admin';
      if (typeof raw !== 'string' || raw.length === 0) return fallback;
      if (!raw.startsWith('/') || raw.startsWith('//') || raw.startsWith('/\\')) return fallback;
      try {
        const resolved = new URL(raw, window.location.origin);
        if (resolved.origin !== window.location.origin) return fallback;
        return resolved.pathname + resolved.search + resolved.hash;
      } catch (e) {
        return fallback;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = sanitizeReturnUrl(urlParams.get('return'));

    async function checkWebAuthnStatus() {
      try {
        const response = await fetch(`${API_BASE}/webauthn/status`);
        const data = await response.json();
        
        // Passwordless-first approach: Show Yubikey as primary if available
        if (data.enabled && data.hasCredentials) {
          // Yubikey available - show as primary, password as fallback
          webauthnSection.style.display = 'block';
          passwordSection.style.display = 'block'; // Show password as secondary option
        } else if (data.enabled && !data.hasCredentials) {
          webauthnSection.style.display = 'none';
          passwordSection.style.display = 'block';
          const infoMsg = document.createElement('div');
          infoMsg.style.cssText = 'text-align: center; margin-bottom: 1rem; padding: 0.75rem; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; color: rgba(255, 255, 255, 0.8); font-size: 0.85rem;';
          infoMsg.textContent = 'ℹ️ WebAuthn is enabled but no security keys are registered yet. Use password to login and register your first key in the admin panel.';
          passwordSection.insertBefore(infoMsg, passwordSection.firstChild);
        } else {
          webauthnSection.style.display = 'none';
          passwordSection.style.display = 'block';
        }
      } catch (err) {
        console.error('Error checking WebAuthn status:', err);
        webauthnSection.style.display = 'none';
        passwordSection.style.display = 'block';
      }
    }

    // --------------------------------------------------------
    // FIX: base64url → ArrayBuffer conversion
    // --------------------------------------------------------
    function b64urlToBuffer(b64urlString) {
      const base64 = b64urlString.replace(/-/g, '+').replace(/_/g, '/');
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // WebAuthn authentication - use WebAuthnClient for consistent handling
    btnWebAuthn?.addEventListener('click', async () => {
      try {
        btnWebAuthn.disabled = true;
        btnWebAuthn.innerHTML = 'Authenticating... <span class="loading"></span>';
        errorDiv.classList.remove('show');

        // Initialize WebAuthnClient if available, otherwise fall back to manual method
        if (window.WebAuthnClient) {
          WebAuthnClient.init({ apiBase: API_BASE });
          const result = await WebAuthnClient.authenticate();
          
          if (result.verified) {
            window.location.href = returnUrl;
          } else {
            showError('Authentication failed. Please try again.');
            btnWebAuthn.disabled = false;
            btnWebAuthn.innerHTML = '🔐 Login with Yubikey!';
          }
        } else {
          // Fallback to manual method if WebAuthnClient not available
        const optionsResponse = await fetch(`${API_BASE}/webauthn/authenticate/options`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        
        if (!optionsResponse.ok) {
          throw new Error('Failed to get authentication options');
        }
        
        const options = await optionsResponse.json();

          console.log("LOGIN: RAW OPTIONS FROM SERVER >>>", options);
          console.log("LOGIN: CHALLENGE TYPE:", typeof options.challenge, options.challenge);

          // Convert allowCredentials[].id from base64url string → ArrayBuffer
          // BUT: Keep challenge as STRING (SimpleWebAuthnBrowser v9 expects base64url string, not ArrayBuffer)
          if (options.allowCredentials) {
            options.allowCredentials = options.allowCredentials.map(c => ({
              ...c,
              id: b64urlToBuffer(c.id),
            }));
          }

          // Ensure challenge stays as a string (SimpleWebAuthnBrowser v9 expects base64url string)
          // Do NOT convert challenge to ArrayBuffer - that causes "e.replace is not a function" error
          if (options.challenge && typeof options.challenge !== 'string') {
            console.warn("LOGIN: Challenge is not a string, this may cause errors:", typeof options.challenge);
          }

        const assertionResponse = await SimpleWebAuthnBrowser.startAuthentication(options);

        const verifyResponse = await fetch(`${API_BASE}/webauthn/authenticate/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(assertionResponse)
        });

        const verifyData = await verifyResponse.json();

        if (verifyData.verified) {
          window.location.href = returnUrl;
        } else {
          showError('Authentication failed. Please try again.');
          btnWebAuthn.disabled = false;
            btnWebAuthn.innerHTML = '🔐 Login with Yubikey!';
          }
        }
      } catch (err) {
        let errorMessage = err.message || 'WebAuthn authentication failed. Please try again.';

        if (err.name === 'NotAllowedError') {
          errorMessage = 'Authentication was cancelled or timed out. Please try again.';
        } else if (err.name === 'InvalidStateError') {
          errorMessage = 'The key is not registered. Please register your security key first.';
        } else if (err.name === 'NotSupportedError') {
          errorMessage = 'WebAuthn is not supported in this browser.';
        }

        showError(errorMessage);
        btnWebAuthn.disabled = false;
        btnWebAuthn.innerHTML = '🔐 Login with Yubikey!';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError('Please enter both username and password');
        return;
      }
      
      btnLogin.disabled = true;
      btnLogin.innerHTML = 'Logging in... <span class="loading"></span>';
      errorDiv.classList.remove('show');
      
      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          window.location.href = returnUrl;
        } else {
          showError(data.error || 'Invalid credentials');
          btnLogin.disabled = false;
          btnLogin.textContent = 'Login';
        }
      } catch (err) {
        showError('Connection error. Please try again.');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Login';
      }
    });

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }

    checkWebAuthnStatus().then(() => {
      if (passwordSection.style.display !== 'none') {
        document.getElementById('username').focus();
      }
    });
  </script>
</body>
</html>
