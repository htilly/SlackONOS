name: E2E Tests

# Runs the full Slack end-to-end suite (SlackONOS + TestBot) on the test machine.
# Triggered by every push to master, every published release, and manually
# from the Actions tab (any branch). The run type is recorded with the results
# so the admin page graph can tell master builds, releases and manual runs apart.
#
# The e2e job is guarded to github.actor == 'htilly'. The runner is a
# self-hosted runner on a host with LAN access and live credentials on disk,
# and this repository is public, so the job must never run for anyone else.
# NOTE: this guard lives in the workflow file, so it is a backstop, not the
# primary control - a pull request can edit this file. The real control is the
# repository's "Require approval for all external contributors" fork-PR
# setting.
# Runs on a self-hosted runner with label "slackonos-e2e"; all tokens/API
# keys live on that machine (see test/INTEGRATION_TESTING.md), no GitHub
# secrets are used.
#
# Each run's response times are appended to data/e2e-history.json on master
# by the record-history job, so every later build (and Docker image) ships
# the history graphed on the admin page. That job runs on a GitHub-hosted
# runner - the self-hosted runner never gets write access to the repo.

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # The history commits this workflow makes itself
      - 'data/e2e-history.json'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One physical Sonos speaker - never run two e2e jobs at once. Runs queue;
  # if several master pushes queue up, GitHub keeps only the newest pending one.
  group: slackonos-e2e
  cancel-in-progress: false

jobs:
  e2e:
    # Only the repository owner may put code on the self-hosted runner.
    if: github.actor == 'htilly'
    runs-on: [self-hosted, slackonos-e2e]
    timeout-minutes: 45

    steps:
    - name: Checkout code under test
      uses: actions/checkout@v6
      with:
        # Release: the tag. Push/manual: the exact commit that triggered the run
        ref: ${{ github.event.release.tag_name || github.sha }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22.x

    - name: Install dependencies
      run: npm ci

    - name: Check e2e config location
      run: |
        if [ -z "$E2E_CONFIG_DIR" ]; then
          echo "::error::E2E_CONFIG_DIR is not set on the runner. Add it to the runner's .env (see test/INTEGRATION_TESTING.md)."
          exit 1
        fi

    - name: Clear results from earlier runs
      run: rm -f test/e2e-run.json

    # Production SlackONOS runs on this same host and shares this Slack app
    # and the one physical Sonos speaker, so it must be down while the suite's
    # own SlackONOS instance is up. Two Socket Mode connections for one app
    # split the events between them and the suite misses replies.
    - name: Stop production SlackONOS
      run: docker stop slackonos

    - name: Run e2e tests
      # Bot output is kept out of the (public) Actions log; the full log stays
      # on the runner in test/e2e-bot.log inside the job workspace.
      env:
        E2E_QUIET_BOT: '1'
        # Graph label: release tag, branch for manual runs, empty for master
        # pushes (the graph then shows the short commit SHA)
        E2E_RELEASE: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
      run: npm run test:e2e

    # Must run even when the suite fails, so a red build never leaves
    # production down. See also the host-side watchdog, which covers the
    # cancelled-run path where always() does not fire.
    - name: Restart production SlackONOS
      if: always()
      run: docker start slackonos

    - name: Upload run results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-run
        path: test/e2e-run.json
        if-no-files-found: warn
        retention-days: 7

  record-history:
    # Commits the run into data/e2e-history.json on master, even when tests failed
    needs: e2e
    if: always() && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download run results
      id: download
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: e2e-run
        path: ${{ runner.temp }}/e2e-run

    - name: Checkout master
      if: steps.download.outcome == 'success'
      uses: actions/checkout@v6
      with:
        ref: master

    - name: Setup Node.js
      if: steps.download.outcome == 'success'
      uses: actions/setup-node@v6
      with:
        node-version: 22.x

    - name: Append run and push
      if: steps.download.outcome == 'success'
      env:
        RUN_FILE: ${{ runner.temp }}/e2e-run/e2e-run.json
        RUN_LABEL: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "push" ]; then
          RUN_LABEL="master@${GITHUB_SHA::7}"
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Retry in case master moved while we were appending
        for attempt in 1 2 3; do
          git fetch origin master
          git reset --hard origin/master
          node test/tools/append-e2e-history.mjs "$RUN_FILE" data/e2e-history.json
          git add data/e2e-history.json
          git commit -m "chore(e2e): record response times for $RUN_LABEL [skip ci]"
          if git push origin HEAD:master; then
            exit 0
          fi
          echo "Push failed (attempt $attempt), retrying..."
          sleep $((attempt * 5))
        done
        echo "::error::Could not push e2e history to master (branch protection?)"
        exit 1
